- figure: 22
  papername: 2025baryonantibaryon
  citation: Phys. Rev. C113 (2025) 4, 045207
  doi: 10.1103/h197-l9dw
  caption:  Total photoproduction cross sections off the proton, as a function of beam energy, for the $\{$p\bar{p}$\}$ (blue circles), $\{ \Lambda\bar{\Lambda} \}$(red squares), and $\{p \bar{\Lambda}\}$ (open red circles) systems.  The red axis on the right corresponds to the red data points and curves in the figure, while the black axis on the left corresponds to all other data points and curves.  The error bars show the statistical uncertainties only.  Comparison is made to a selection of previous $\{$p\bar{p}$\}$ measurements from Daresbury (open circles) \cite{Barber,1979ah},  DESY \cite{Bodenkamp,1984dg} (open squares),  SLAC \cite{Bingham,1973fu} (4-point star) and CERN \cite{Aston,1980gri} (5-point star).  The curves represent the behavior of the total cross section modeled with the simplified picture (Eq. 16), for each reaction channel, $p\bar{p}$ (solid blue), $\Lambda\bar{\Lambda}$ (solid red), and ${p \bar{\Lambda}}$ (dashed red). The blue model curve for the $p\bar{p}$ channel also includes an extrapolation to the high energy datum from CERN.  As a reference, the dotted-dashed curves illustrate integrated 3-body phase space (Eq. A13) for the $pp\bar{p}$ (blue) and $p\Lambda\bar{\Lambda}$ (red) final states.  

